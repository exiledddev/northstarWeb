[package]
name = "northstar-web"
version = "0.1.0"
edition = "2021"
description = "Northstar in a browser tab: the desktop app's own code, over the team library."
license = "MIT"
authors = ["MarkedExiled Software"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The whole app, design system and all, straight from the desktop repo —
# pinned, so a desktop change reaches the web only when this line moves.
northstar = { git = "https://github.com/exiledddev/northstar", rev = "bd41eb256173bbf14a4ec22b7f320a3bd6063bf5" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Crypto",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "Headers",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "History",
    "HtmlInputElement",
    "Location",
    "Navigator",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Storage",
    "Url",
    "VisibilityState",
    "Window",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
# snapshots travel deflated
miniz_oxide = "0.8"
base64 = "0.22"
# Discord pictures arrive as PNG
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

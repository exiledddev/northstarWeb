# Northstar Web — the Worker that serves the app and the team library.
# Setup steps are in ../README.md.
name = "northstar"
main = "build/index.js"
compatibility_date = "2026-09-01"

[build]
command = "cargo install -q worker-build@0.8.7 && worker-build --release"
watch_dir = "src"

# The app itself (web/build.sh puts it in web/dist). Cloudflare serves these
# files without running the Worker; only /api/* and /auth/* reach it.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

# The first `npm run deploy` creates this database and writes its
# database_id in here (wrangler 4.45 or newer); commit that line afterwards.
[[d1_databases]]
binding = "DB"
database_name = "northstar"
migrations_dir = "migrations"

[vars]
# What the app calls the team.
TEAM_NAME = "MarkedExiled Software"

# Kept out of this file, as secrets, so a deploy can never blank them
# (README, step 4):
#   npx wrangler secret put OWNER_DISCORD_IDS       your Discord user id(s), comma separated
#   npx wrangler secret put DISCORD_CLIENT_ID       the Discord application's client id
#   npx wrangler secret put DISCORD_CLIENT_SECRET   its client secret
